name: Build mYTmusic Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mytmusic-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Retain preinstalled Android tools location
        run: echo "PREINSTALLED_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Prepare checked-in source
        run: chmod +x gradlew
      - name: Install verified Android SDK packages
        shell: python
        run: |
          from pathlib import Path
          import urllib.request,xml.etree.ElementTree as E,hashlib,zipfile,shutil,copy,os
          sdk=Path(os.environ['RUNNER_TEMP'])/'mytmusic-android-sdk';sdk.mkdir(exist_ok=True)
          xml=E.fromstring(urllib.request.urlopen('https://dl.google.com/android/repository/repository2-3.xml').read())
          packages={p.attrib['path']:p for p in xml if 'path' in p.attrib}
          E.register_namespace('common','http://schemas.android.com/repository/android/common/02')
          E.register_namespace('xsi','http://www.w3.org/2001/XMLSchema-instance')
          for key in ['platforms;android-37.0','build-tools;36.0.0','build-tools;37.0.0']:
              remote=packages[key]
              archive=next(a for a in remote.findall('./archives/archive') if a.findtext('host-os') in [None,'linux'])
              raw=urllib.request.urlopen('https://dl.google.com/android/repository/'+archive.findtext('./complete/url')).read()
              assert hashlib.sha1(raw).hexdigest()==archive.findtext('./complete/checksum')
              saved=sdk/(key.replace(';','-')+'.zip');saved.write_bytes(raw)
              stage=sdk/(key.replace(';','-')+'-extract');stage.mkdir(exist_ok=True)
              with zipfile.ZipFile(saved) as z:
                  z.extractall(stage)
                  for info in z.infolist():
                      p=stage/info.filename;mode=(info.external_attr>>16)&0o777
                      if p.is_file() and mode:p.chmod(mode)
              target=sdk/key.replace(';','/');target.parent.mkdir(exist_ok=True,parents=True)
              shutil.move(str(next(stage.iterdir())),target)
              description=E.Element('{http://schemas.android.com/repository/android/common/02}repository',{'xmlns:sdk':'http://schemas.android.com/sdk/android/repo/repository2/03','xmlns:generic':'http://schemas.android.com/repository/android/generic/02','xmlns:sdk-common':'http://schemas.android.com/sdk/android/repo/common/03'})
              for license in xml.findall('license'):description.append(copy.deepcopy(license))
              local=E.SubElement(description,'localPackage',{'path':key,'obsolete':'false'})
              for tag in ['type-details','revision','display-name','uses-license']:
                  child=remote.find(tag)
                  if child is not None:local.append(copy.deepcopy(child))
              (target/'package.xml').write_bytes(E.tostring(description,encoding='UTF-8',xml_declaration=True))
          (sdk/'licenses').mkdir(exist_ok=True)
          (sdk/'licenses/android-sdk-license').write_text('8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n')
          Path('local.properties').write_text('sdk.dir='+str(sdk)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ANDROID_HOME='+str(sdk)+'\nANDROID_SDK_ROOT='+str(sdk)+'\n')
      - name: Bootstrap pinned Gradle
        run: ./gradlew --version --no-daemon
      - name: Verify playback, playlists and Segue updates
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,urllib.request
          root=Path.cwd();gradle_home=Path(os.environ.get('GRADLE_USER_HOME',str(Path.home()/'.gradle')))
          compiler=next(gradle_home.rglob('gradle-9.8.1/lib/kotlin-compiler-embeddable-*.jar'))
          lib=compiler.parent;work=Path(os.environ['RUNNER_TEMP'])/'mytmusic-timing-tests';work.mkdir(exist_ok=True)
          for filename,url in [('junit.jar','https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar'),('hamcrest.jar','https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar')]:
              (work/filename).write_bytes(urllib.request.urlopen(url).read())
          stdlib=next(lib.glob('kotlin-stdlib-*.jar'));classes=work/'classes';classes.mkdir(exist_ok=True)
          kotlin_version=stdlib.stem.removeprefix('kotlin-stdlib-')
          for artifact in ['kotlin-test','kotlin-test-junit']:
              (work/(artifact+'.jar')).write_bytes(urllib.request.urlopen(f'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/{artifact}/{kotlin_version}/{artifact}-{kotlin_version}.jar').read())
          cp=os.pathsep.join(str(p) for p in lib.glob('*.jar'))
          sources=[root/'core/media/media3/src/main/java/com/maxrave/media3/exoplayer/SeamlessTiming.kt',root/'core/media/media3/src/test/java/com/maxrave/media3/exoplayer/SeamlessTimingTest.kt',root/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/utils/QuickAddDestination.kt',root/'composeApp/src/jvmTest/kotlin/com/maxrave/simpmusic/utils/QuickAddDestinationTest.kt',root/'core/media/media3/src/main/java/com/maxrave/media3/exoplayer/AutomaticTransitionPolicy.kt',root/'core/media/media3/src/test/java/com/maxrave/media3/exoplayer/AutomaticTransitionPolicyTest.kt',root/'core/domain/src/commonMain/kotlin/com/maxrave/domain/utils/YouTubePlaylistPolicy.kt',root/'androidApp/src/test/java/com/renz/segue/YouTubePlaylistPolicyTest.kt']
          stub=work/'BuildKonfig.kt';stub.write_text('package com.maxrave.simpmusic\nobject BuildKonfig { const val versionName = "2.4.5" }\n')
          sources += [stub,root/'core/domain/src/commonMain/kotlin/com/maxrave/domain/data/model/update/SegueReleasePolicy.kt',root/'androidApp/src/test/java/com/renz/segue/SegueReleasePolicyTest.kt',root/'composeApp/src/commonMain/kotlin/com/maxrave/simpmusic/utils/VersionManager.kt',root/'composeApp/src/jvmTest/kotlin/com/maxrave/simpmusic/utils/SegueVersionTest.kt']
          subprocess.run(['java','-Xmx256m','-cp',cp,'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler','-no-stdlib','-no-reflect','-classpath',os.pathsep.join(str(p) for p in [stdlib,work/'junit.jar',work/'kotlin-test.jar',work/'kotlin-test-junit.jar']),'-d',str(classes),*[str(p) for p in sources]],check=True)
          cp=os.pathsep.join(str(p) for p in [stdlib,work/'junit.jar',work/'hamcrest.jar',work/'kotlin-test.jar',work/'kotlin-test-junit.jar',classes])
          r=subprocess.run(['java','-Xmx128m','-cp',cp,'org.junit.runner.JUnitCore','com.maxrave.media3.exoplayer.SeamlessTimingTest','com.maxrave.simpmusic.utils.QuickAddDestinationTest','com.maxrave.media3.exoplayer.AutomaticTransitionPolicyTest','com.renz.segue.YouTubePlaylistPolicyTest','com.renz.segue.SegueReleasePolicyTest','com.maxrave.simpmusic.utils.SegueVersionTest'],check=True,capture_output=True,text=True)
          print(r.stdout);Path('timing-test-result.txt').write_text(r.stdout)
      - name: Build the unsigned release APK
        run: ./gradlew -I personal-build.gradle :androidApp:assembleRelease :androidApp:assembleDebug -PisFullBuild=false --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g -Pkotlin.daemon.jvmargs=-Xmx1536m
      - name: Collect unsigned APK for private signing
        shell: python
        run: |
          from pathlib import Path
          import shutil,hashlib,json,subprocess,os
          files=list(Path('androidApp/build/outputs/apk/release').glob('*.apk'))
          assert files,'The Android build produced no APK'
          chosen=next((p for p in files if 'universal' in p.name),files[0])
          out=Path('apk-artifacts');out.mkdir(exist_ok=True)
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools/36.0.0'
          target=out/'mYTmusic-unsigned.apk'
          subprocess.run([str(sdk/'zipalign'),'-P','16','-f','4',str(chosen),str(target)],check=True)
          subprocess.run([str(sdk/'zipalign'),'-c','-P','16','4',str(target)],check=True)
          # Public SDK signing utility only. The private key stays on the owner's workspace.
          shutil.copy2(sdk/'lib/apksigner.jar',out/'apksigner.jar')
          if (sdk/'NOTICE.txt').exists():shutil.copy2(sdk/'NOTICE.txt',out/'android-build-tools-NOTICE.txt')
          (out/'apk-badging.txt').write_bytes(subprocess.check_output([str(sdk/'aapt2'),'dump','badging',str(target)]))
          (out/'apk-manifest.txt').write_bytes(subprocess.check_output([str(sdk/'aapt2'),'dump','xmltree',str(target),'--file','AndroidManifest.xml']))
          shutil.copy2('timing-test-result.txt',out/'timing-test-result.txt')
          debug=list(Path('androidApp/build/outputs/apk/debug').glob('*.apk'))
          assert debug,'The Android build produced no debug APK'
          selected_debug=next((p for p in debug if 'universal' in p.name),next((p for p in debug if 'x86_64' in p.name),debug[0]))
          shutil.copy2(selected_debug,out/'selection-debug.apk')
          (out/'build-info.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'file':target.name,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'signed':False,'signing':'Signed privately after downloading; no private key is uploaded'},indent=2))
      - name: Keep candidate for emulator retries
        uses: actions/upload-artifact@v4
        with:
          name: selection-build-candidate-${{ github.run_attempt }}
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 3
      - name: Prepare emulator tools
        shell: python
        run: |
          from pathlib import Path
          import os,shutil
          native=Path(os.environ['PREINSTALLED_ANDROID_SDK']);sdk=Path(os.environ['ANDROID_HOME'])
          for name in ['cmdline-tools','emulator','platform-tools']:
              if (native/name).exists():shutil.copytree(native/name,sdk/name,dirs_exist_ok=True)
          with open(os.environ['GITHUB_PATH'],'a') as f:f.write(str(sdk/'platform-tools')+'\n')
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test playback selection on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/check-playback-selection.py
      - name: Keep playback test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-selection-diagnostics
          path: ui-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - name: Attach successful playback test
        shell: python
        run: |
          from pathlib import Path
          import shutil
          out=Path('apk-artifacts')
          shutil.copy2('ui-smoke/playback-selection-result.json',out/'playback-selection-test-result.json')
          (out/'selection-debug.apk').unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: mYTmusic-unsigned-apk
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 7

