name: Build mYTmusic Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: mytmusic-android
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare and publish the personal source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            echo "Using the source already in this repository."
            exit 0
