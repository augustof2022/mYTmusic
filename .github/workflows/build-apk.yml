      - name: Install verified Android SDK packages
        shell: python
        run: |
          from pathlib import Path
          import urllib.request,xml.etree.ElementTree as E,hashlib,zipfile,shutil,copy,os
          sdk=Path(os.environ['RUNNER_TEMP'])/'mytmusic-android-sdk';sdk.mkdir(exist_ok=True)
          xml=E.fromstring(urllib.request.urlopen('https://dl.google.com/android/repository/repository2-3.xml').read())
          packages={p.attrib['path']:p for p in xml if 'path' in p.attrib}
          E.register_namespace('common','http://schemas.android.com/repository/android/common/02')
          E.register_namespace('xsi','http://www.w3.org/2001/XMLSchema-instance')
          for key in ['platforms;android-37.0','build-tools;36.0.0','build-tools;37.0.0']:
              remote=packages[key]
              archive=next(a for a in remote.findall('./archives/archive') if a.findtext('host-os') in [None,'linux'])
              raw=urllib.request.urlopen('https://dl.google.com/android/repository/'+archive.findtext('./complete/url')).read()
              assert hashlib.sha1(raw).hexdigest()==archive.findtext('./complete/checksum')
              saved=sdk/(key.replace(';','-')+'.zip');saved.write_bytes(raw)
              stage=sdk/(key.replace(';','-')+'-extract');stage.mkdir(exist_ok=True)
              with zipfile.ZipFile(saved) as z:
                  z.extractall(stage)
                  for info in z.infolist():
                      p=stage/info.filename;mode=(info.external_attr>>16)&0o777
                      if p.is_file() and mode:p.chmod(mode)
              target=sdk/key.replace(';','/');target.parent.mkdir(exist_ok=True,parents=True)
              shutil.move(str(next(stage.iterdir())),target)
              description=E.Element('{http://schemas.android.com/repository/android/common/02}repository',{'xmlns:sdk':'http://schemas.android.com/sdk/android/repo/repository2/03','xmlns:generic':'http://schemas.android.com/repository/android/generic/02','xmlns:sdk-common':'http://schemas.android.com/sdk/android/repo/common/03'})
              for license in xml.findall('license'):description.append(copy.deepcopy(license))
              local=E.SubElement(description,'localPackage',{'path':key,'obsolete':'false'})
              for tag in ['type-details','revision','display-name','uses-license']:
                  child=remote.find(tag)
                  if child is not None:local.append(copy.deepcopy(child))
              (target/'package.xml').write_bytes(E.tostring(description,encoding='UTF-8',xml_declaration=True))
          (sdk/'licenses').mkdir(exist_ok=True)
          (sdk/'licenses/android-sdk-license').write_text('8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n')
          Path('local.properties').write_text('sdk.dir='+str(sdk)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ANDROID_HOME='+str(sdk)+'\nANDROID_SDK_ROOT='+str(sdk)+'\n')
      - name: Bootstrap pinned Gradle
        run: ./gradlew --version --no-daemon
      - name: Verify crossfade timing
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,urllib.request
          root=Path.cwd();gradle_home=Path(os.environ.get('GRADLE_USER_HOME',str(Path.home()/'.gradle')))
          compiler=next(gradle_home.rglob('gradle-9.8.1/lib/kotlin-compiler-embeddable-*.jar'))
          lib=compiler.parent;work=Path(os.environ['RUNNER_TEMP'])/'mytmusic-timing-tests';work.mkdir(exist_ok=True)
          for filename,url in [('junit.jar','https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar'),('hamcrest.jar','https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar')]:
              (work/filename).write_bytes(urllib.request.urlopen(url).read())
          stdlib=next(lib.glob('kotlin-stdlib-*.jar'));classes=work/'classes';classes.mkdir(exist_ok=True)
          cp=os.pathsep.join(str(p) for p in lib.glob('*.jar'))
          sources=[root/'core/media/media3/src/main/java/com/maxrave/media3/exoplayer/SeamlessTiming.kt',root/'core/media/media3/src/test/java/com/maxrave/media3/exoplayer/SeamlessTimingTest.kt']
          subprocess.run(['java','-Xmx256m','-cp',cp,'org.jetbrains.kotlin.cli.jvm.K2JVMCompiler','-no-stdlib','-no-reflect','-classpath',str(stdlib)+os.pathsep+str(work/'junit.jar'),'-d',str(classes),*[str(p) for p in sources]],check=True)
          cp=os.pathsep.join(str(p) for p in [stdlib,work/'junit.jar',work/'hamcrest.jar',classes])
          r=subprocess.run(['java','-Xmx128m','-cp',cp,'org.junit.runner.JUnitCore','com.maxrave.media3.exoplayer.SeamlessTimingTest'],check=True,capture_output=True,text=True)
          print(r.stdout);Path('timing-test-result.txt').write_text(r.stdout)
      - name: Build the unsigned release APK
        run: ./gradlew -I personal-build.gradle :androidApp:assembleRelease -PisFullBuild=false --no-daemon --no-configuration-cache --max-workers=1 -Dorg.gradle.jvmargs=-Xmx5g -Pkotlin.daemon.jvmargs=-Xmx1536m
      - name: Collect unsigned APK for private signing
        shell: python
        run: |
          from pathlib import Path
          import shutil,hashlib,json,subprocess
          files=list(Path('androidApp/build/outputs/apk/release').glob('*.apk'))
          assert files,'The Android build produced no APK'
          chosen=next((p for p in files if 'universal' in p.name),files[0])
          out=Path('apk-artifacts');out.mkdir(exist_ok=True)
          target=out/'mYTmusic-unsigned.apk';shutil.copy2(chosen,target)
          shutil.copy2('timing-test-result.txt',out/'timing-test-result.txt')
          (out/'build-info.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'file':target.name,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'signed':False,'signing':'Signed privately after downloading; no private key is uploaded'},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: mYTmusic-unsigned-apk
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 7
