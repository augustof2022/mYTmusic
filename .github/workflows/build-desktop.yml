name: Build mYTmusic Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mytmusic-desktop
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test shared playback rules
        run: ./gradlew -I personal-build.gradle :domain:jvmTest --no-daemon --no-configuration-cache
      - name: Compile the desktop app
        run: ./gradlew -I personal-build.gradle :desktopApp:compileKotlinJvm --no-daemon --no-configuration-cache
      - name: Package the Windows installer
        id: msi
        continue-on-error: true
        run: ./gradlew -I personal-build.gradle :desktopApp:packageMsi --no-daemon --no-configuration-cache
      - name: Attach the Windows installer
        if: steps.msi.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mYTmusic-desktop-windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 14
