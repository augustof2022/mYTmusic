name: Pause Segue v2.4.5 release
on:
  push:
    branches: [automation/pause-segue-v245]
permissions:
  contents: write
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the release as a draft during phone installation investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.4.5 --repo augustof2022/mYTmusic --draft
