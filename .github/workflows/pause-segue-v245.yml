name: Restore Segue release after phone installation confirmed
on:
  push:
    branches: [automation/pause-segue-v245]
permissions:
  contents: write
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified release after successful phone installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.4.5 --repo augustof2022/mYTmusic --draft=false --latest
