name: Publish Segue v2.4.5
on:
  push:
    branches: [automation/publish-segue-v2.4.5]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mYTmusic-unsigned-apk
          repository: augustof2022/mYTmusic
          run-id: 41292092878
          github-token: ${{ github.token }}
          path: apk-artifacts
      - name: Reconstruct and verify the privately signed APK
        shell: python
        run: |
          import base64, hashlib, json, struct, subprocess, zipfile
          from pathlib import Path
          p = Path("apk-artifacts")
          info = json.loads((p / "build-info.json").read_text())
          assert info["commit"] == "391c3f593f180cd40d624cd44dc5702d85496597"
          data = (p / "mYTmusic-unsigned.apk").read_bytes()
          assert hashlib.sha256(data).hexdigest() == info["sha256"]
          pos = data.rfind(b"PK\x05\x06")
          assert pos >= 0 and pos + 22 + struct.unpack_from("<H", data, pos + 20)[0] == len(data)
          size, offset = struct.unpack_from("<II", data, pos + 12)
          assert offset + size == pos
          block = base64.b64decode("", validate=True)
          output = bytearray(data[:offset] + block + data[offset:])
          struct.pack_into("<I", output, pos + len(block) + 16, offset + len(block))
          assert hashlib.sha256(output).hexdigest() == "006aeb2f6df7ee49b35d10e7c26264641a2a40ef7c8ada42ed5bcc0f4b33eae3"
          apk = Path("Segue-Android.apk"); apk.write_bytes(output)
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
          verification = subprocess.run(["java", "-jar", str(p / "apksigner.jar"), "verify", "--verbose", "--print-certs", str(apk)], check=True, capture_output=True, text=True).stdout.lower()
          assert "verified using v2 scheme (apk signature scheme v2): true" in verification
          assert "e50ff7735f171b3f2db5bbad079f8872839c94d4d7d49bbd0714bf02dbf4872c" in verification
          print("Signed Segue APK and certificate verified")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v2.4.5 Segue-Android.apk
          --repo augustof2022/mYTmusic
          --target 391c3f593f180cd40d624cd44dc5702d85496597
          --title "Segue v2.4.5"
          --notes "Adds update checks for published Segue releases in this repository. Future updates will appear inside the app. Install this first updater version manually."
          --latest
